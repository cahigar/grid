# Minero voraz: se acerca en línea recta y esquiva al azar.
def ir_a(tx, ty):
    for _ in range(120):
        x, y = posicion()
        if (x, y) == (tx, ty):
            return True
        opciones = []
        if tx > x: opciones.append("E")
        if tx < x: opciones.append("O")
        if ty > y: opciones.append("S")
        if ty < y: opciones.append("N")
        if not mover(random.choice(opciones)):
            mover(random.choice(["N", "S", "E", "O"]))
    return False

DIRS = {"N": (0, -1), "S": (0, 1), "E": (1, 0), "O": (-1, 0)}

def bfs(destino):
    inicio = posicion()
    padre = {inicio: None}
    cola = [inicio]
    i = 0
    while i < len(cola) and i < 900:
        p = cola[i]
        i += 1
        if p == destino:
            break
        for d, (dx, dy) in DIRS.items():
            q = (p[0] + dx, p[1] + dy)
            if q not in padre and (q == destino or transitable(q[0], q[1])):
                padre[q] = (p, d)
                cola.append(q)
    if destino not in padre:
        return None
    pasos = []
    n = destino
    while padre[n] is not None:
        p, d = padre[n]
        pasos.append(d)
        n = p
    pasos.reverse()
    return pasos

def ir_a(x, y):
    camino = bfs((x, y))
    if camino is None:
        return False
    puntos = []
    px, py = posicion()
    for d in camino:
        px, py = px + DIRS[d][0], py + DIRS[d][1]
        puntos.append((px, py))
    dibujar_ruta(puntos)
    for d in camino:
        if not mover(d):
            return False
    return True

                d = (d + 1) % 4
